[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semen-banan"
version = "0.1.0"
description = "Reactive Telegram bot with OpenClaw and local music generation"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.0,<2", "imageio-ffmpeg>=0.5,<1", "mido>=1.3,<2"]

[project.optional-dependencies]
music = ["numpy>=2.0,<3", "onnxruntime>=1.20,<2", "piper-tts>=1.8,<1.9"]
dev = ["ruff", "mypy"]

[project.scripts]
semen-banan = "semen_banan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"semen_banan.resources" = ["persona.txt"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src/semen_banan"]
check_untyped_defs = true
ignore_missing_imports = true
